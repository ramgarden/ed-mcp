[project]
name = "ed-mcp"
version = "0.1.0"
description = "Elite Dangerous MCP service: plain-English queries over local journals, EDDN, EDSM/Inara/Spansh data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ramgarden" }]
keywords = ["elite-dangerous", "mcp", "eddn", "inara", "spansh", "edsm"]
dependencies = [
  "mcp>=1.0.0,<2",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "pyzmq>=26.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
ed-mcp = "ed_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
